# Copy to workshop.toml and run `cargo run -- --config workshop.toml`.
#
# The optional GitHub token comes from the environment variable WORKSHOP_GITHUB_TOKEN, never from
# this file. A read-only token with no scopes is enough for a public repository.

# The repository Workshop indexes, as owner/name.
repository = "LyraCoreProject/LyraCore"

# GitHub logins of the maintainers. Their pull requests are not outside pull requests, and they are
# not on the leaderboard. Case does not matter.
maintainers = ["Mathih13"]

# The address the website and the MCP server listen on.
listen = "127.0.0.1:8080"

# What a contributor pastes into an agent started in a clone of the repository. The website shows it
# under the clone command, and the MCP tool `rules` returns it.
start_prompt = "Follow .claude/skills/contribute-fix/SKILL.md from start to finish: set up this machine, claim an open issue, fix it and open the pull request."

# Seconds between refreshes, at least 60. Default 900. Without a token GitHub allows 60 API requests
# an hour, and one refresh costs 4 requests plus 1 per held claim and 2 per open outside pull
# request, so keep the default. With a token, 60 is safe.
refresh_interval_secs = 900
